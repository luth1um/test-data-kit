[package]
name = "test-data-kit"
version = "0.1.0"
authors = ["luth1um"]
description = "A generator for test data requiring checksums and specific formats."
license = "MIT OR Apache-2.0"
repository = "https://github.com/luth1um/test-data-kit"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
wasm-bindgen = "=0.2.130"
getrandom = { version = "0.4.3", features = ["wasm_js"] }